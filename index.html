<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abhivansh Srivastav | Links & Visuals</title>
  
  <!-- Modern Clean Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: #090a0f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
      color: #f1f5f9;
      position: relative;
      overflow-x: hidden;
    }

    /* Aesthetic Ambient Glow */
    .glow-orb-1 {
      position: fixed;
      top: 10%;
      left: 10%;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
    }
    .glow-orb-2 {
      position: fixed;
      bottom: 10%;
      right: 10%;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.18) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
    }

    /* Glassmorphic Container */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 34px 22px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Profile Section */
    .profile-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 16px;
    }
    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .badge {
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 500;
      margin-bottom: 22px;
      display: inline-block;
    }

    /* Instagram Aesthetic Button */
    .insta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 26px;
      transition: all 0.3s ease;
    }
    .insta-btn:hover {
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(220, 39, 67, 0.35);
    }

    /* Section Header */
    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .section-header span {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #64748b;
      font-weight: 700;
    }
    .section-header .line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    /* Gallery Grid (6 Images) */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .gallery-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.08);
    }
  </style>
</head>
<body>

  <!-- Ambient Glow -->
  <div class="glow-orb-1"></div>
  <div class="glow-orb-2"></div>

  <div class="card">
    <!-- Profile Photo -->
    <div class="profile-wrapper">
      <img src="dp-1.png" alt="Profile" class="profile-img" />
    </div>
    
    <h1>Abhivansh Srivastav</h1>
    <div class="badge">Creator • Visuals • Edits</div>

    <!-- Instagram Button -->
    <a href="https://instagram.com/whos.nthng" target="_blank" class="insta-btn">
      <span>Instagram @whos.nthng</span>
    </a>

    <!-- Visuals Section -->
    <div class="section-header">
      <span>Visuals / Gallery</span>
      <div class="line"></div>
    </div>

    <!-- 6 Images Grid -->
    <div class="gallery">
      <div class="gallery-item"><img src="dp-1.png" alt="Shot 1" /></div>
      <div class="gallery-item"><img src="dp-2.png" alt="Shot 2" /></div>
      <div class="gallery-item"><img src="dp-4.png" alt="Shot 3" /></div>
      <div class="gallery-item"><img src="dp-5.jpg" alt="Shot 4" /></div>
      <div class="gallery-item"><img src="dp-6.webp" alt="Shot 5" /></div>
      <div class="gallery-item"><img src="dp-8.png" alt="Shot 6" /></div>
      <div class="gallery-item"><img src="file_00000000c45c82118a1d1ad419f3f96a.png" alt="Shot 7" /></div>
      <div class="gallery-item"><img src="file_0000000010f48211bbc71a562e3b60fa.png" alt="Shot 8" /></div>
    </div>
  </div>

</body>
</html>

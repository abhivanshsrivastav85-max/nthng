<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abhivansh Srivastav | Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 30px;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #38bdf8;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      color: #0f172a;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .links a {
      display: block;
      background: #334155;
      color: #38bdf8;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-weight: 500;
      transition: 0.2s;
    }
    .links a:hover {
      background: #38bdf8;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="dp-1.png" alt="Profile" class="profile-img" style="object-fit: cover;" />
  
    <h1>Abhivansh Srivastav</h1>
    <p>Creator • Visuals • Edits</p>

    <div class="links">
      <a href="https://instagram.com" target="_blank">Instagram</a>
      <a href="https://youtube.com" target="_blank">YouTube</a>
      <a href="#" target="_blank">Projects</a>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abhivansh Srivastav| Links & Visuals</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 28px 20px;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .profile-img {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #38bdf8;
      margin: 0 auto 14px;
      display: block;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 6px;
    }
    p {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .insta-btn {
      display: block;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #ffffff;
      text-decoration: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      margin-bottom: 24px;
      transition: opacity 0.2s;
    }
    .insta-btn:hover {
      opacity: 0.9;
    }
    .section-title {
      font-size: 14px;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-align: left;
    }
    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .gallery img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Apni DP ka exact file name yahan daalein (jaise dp.jpg) -->
    <img src="dp-1.png" alt="Profile" class="profile-img" />
    
    <h1>Abhivansh Srivastav</h1>
    <p>Creator • Visuals • Edits</p>

    <!-- Instagram Direct Link -->
    <a href="https://instagram.com/whos.nthng" target="_blank" class="insta-btn">Instagram @whos.nthng</a>

    <!-- Images Section -->
    <div class="section-title">Visuals / Gallery</div>
    <div class="gallery">
      <!-- Apni uploaded images ke naam yahan set karein -->
      <img src="dp-1.png" alt="Shot 1" />
      <img src="dp-2.png" alt="Shot 2" />
      <img src="dp-4.png" alt="Shot 3" />
      <img src="dp-5.jpg" alt="Shot 4" />
      <img src="dp-6.webp" alt="Shot 5" />
      <img src="dp-8.png" alt="Shot 6" />
    </div>
  </div>

</body>
</html>
